name: Quality (every package with a suite)

# The gate that runs the tests. Complements certify.yml (UI components, 5 dimensions):
# this enforces a successful build, typecheck, lint (0 explicit-any), THE SUITES, and coverage
# thresholds on the four packages that carry them.
#
# `pnpm coverage` filters to four packages, so it cannot stand in for running the suites: on
# its own it would leave ui, cli, design and the builder's e2e/static tests to no gate at all.
# Coverage on four packages and running the suites are different goals; both are here, neither
# substitutes for the other.
#
# Parallel jobs, not one. As one job this took 41 minutes, 35 of them in `pnpm test` running the
# browser suites one after another with one Playwright worker each — site 13.4 min, showcase
# 9.6 min — and coverage ran four of the unit suites a second time (#60). Each job here runs a
# share on its own runner; the browser suites keep one worker each and are split into shards
# instead, so the worker budget a test was written against does not change.
#
# No path filter, on purpose. `build · typecheck · lint · test · coverage` is a REQUIRED check on
# `main`, and a required check that a path filter skips never reports: the pull request waits on
# "Expected" forever. It runs on every change — and so on every package with a suite, including
# one added later (gate-coverage.test.ts holds that).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build first, because the typecheck needs it: packages/framework checks against what core, ui
  # and router publish (dist/*.d.ts), not their sources, and a fresh runner has no dist.
  static:
    name: build · typecheck · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.8.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (every package)
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (0 errors required)
        run: pnpm lint --max-warnings=-1

  # The four packages with coverage thresholds, run ONCE, with coverage: the run is also the
  # suite. `--no-bail`, in the script, so one package's failure cannot hide another's.
  coverage:
    name: coverage (core · compiler · router · lsp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.8.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (every package)
        run: pnpm build
      - name: Suites with coverage thresholds
        run: pnpm coverage
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: coverage-report
          path: |
            packages/core/coverage
            packages/compiler/coverage
            packages/router/coverage
            packages/lsp/coverage

  # The rest of the unit half: `test:unit` without the four that `coverage` runs. The script only
  # EXCLUDES, so a package added tomorrow lands here.
  unit:
    name: unit (every other vitest suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.8.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (every package)
        run: pnpm build
      - name: Unit suites
        run: pnpm test:unit:uncovered

  # The browser half of `pnpm test`, one runner per suite or shard. One worker each, as before:
  # the shards are what make it faster, not a bigger worker count.
  browser:
    name: browser (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: design, run: 'pnpm --filter @pdxui/design run test' }
          - { suite: site, shard: 1/3, run: 'pnpm --filter @pdxui/site exec playwright test --config tests/playwright.config.ts --shard=1/3' }
          - { suite: site, shard: 2/3, run: 'pnpm --filter @pdxui/site exec playwright test --config tests/playwright.config.ts --shard=2/3' }
          - { suite: site, shard: 3/3, run: 'pnpm --filter @pdxui/site exec playwright test --config tests/playwright.config.ts --shard=3/3' }
          # The dev-server config is five tests against its own server: once, with the first shard.
          - { suite: showcase, shard: 1/2, run: 'pnpm --filter @pdxui/showcase exec playwright test --config tests/playwright.config.ts --shard=1/2 && pnpm --filter @pdxui/showcase run test:dev' }
          - { suite: showcase, shard: 2/2, run: 'pnpm --filter @pdxui/showcase exec playwright test --config tests/playwright.config.ts --shard=2/2' }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.8.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (every package)
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @pdxui/design exec playwright install --with-deps chromium
      - name: Suite
        run: ${{ matrix.run }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ${{ matrix.suite }}-report-${{ strategy.job-index }}
          path: packages/${{ matrix.suite }}/test-results

  # The builder has a `test` script, so `pnpm test` reaches these suites too. This job is where CI
  # runs them: it installs a browser for them and uploads the report on failure, and naming the
  # two scripts here keeps the failure attributable to the builder.
  #
  # It is not the only thing that runs them: the pre-push runs `pnpm test`, so a suite that ran
  # only here could not stay broken locally for as long as commits wait to be pushed.
  #
  # test:static is the one that matters most. It builds the site and asserts on CONTENT, never
  # on status codes, because a build that serves nothing still answers 200 to everything — a
  # 200 is exactly what a missing file looks like behind an SPA fallback.
  builder:
    name: builder · e2e + static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.8.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pdxui/builder exec playwright install --with-deps chromium

      - name: Builder e2e (dev server)
        run: pnpm --filter @pdxui/builder run test:e2e

      # Runs against `vite build` output served by `vite preview` — the config starts both, and
      # refuses to reuse an existing server so it can never certify a stale dist.
      - name: Builder static build
        run: pnpm --filter @pdxui/builder run test:static

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: builder-report
          path: packages/builder/test-results

  # The required check. Its name is the one the ruleset on `main` requires, so splitting the work
  # changed nothing in the settings. `always()`: a job that failed or was cancelled must turn this
  # red, not skip it — a skipped required check reads as passed.
  quality:
    name: build · typecheck · lint · test · coverage
    runs-on: ubuntu-latest
    needs: [static, coverage, unit, browser, builder]
    if: always()
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "a job ended '$r'"; exit 1; fi
          done
