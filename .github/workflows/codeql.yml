name: CodeQL

# Static security analysis of the TypeScript and JavaScript sources and of these workflows. Neither
# language needs a build: CodeQL reads the sources as they are.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # actions: read lets the CodeQL action read its own workflow run; without it the analysis fails
    # at the end with "Resource not accessible by integration".
    permissions:
      actions: read
      contents: read
      security-events: write   # uploading the results to code scanning

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
