name: Component Certification

# Certifies the UI components on 5 dimensions (contract math, axe, isolation, keyboard, visual).
# Dimensions 1-4 run directly; 5 (visual) uses the pinned Docker image for deterministic
# screenshots (the same -docker-linux baselines as locally).

# Every change, with no path filter. It used to run only on ui, design and the harness, and a
# change to core or the compiler — which every component is built on — was certified only by the
# pre-push. The pre-push no longer runs certification (#60), so CI is where every change gets it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The values Chromium writes itself at startup, set before it starts (#63): see quality.yml. The
# visual job runs in a container, which does not inherit these; the Dockerfile sets them there.
env:
  FC_FONTATIONS: '1'
  DBUS_SESSION_BUS_ADDRESS: 'disabled:'

# Every job has a timeout (#642): without one a stalled apt ran for six hours. Each value sits above
# the longest successful run of 15 (2026-10-23): a contracts job up to 21 minutes, visual up to 6.
# core's ci-timeouts test holds it.
#
# The contracts jobs run in the official Playwright image, of the version the lockfile pins (#998):
# it carries Chromium and its system libraries, so no job runs apt. Installing them on the runner
# stalled in apt after the Azure mirror fell back. In the image `localhost` resolves to ::1 first,
# where the runner gives 127.0.0.1: a test server bound to localhost listened on ::1 alone, and
# Node's fetch to it connected to 127.0.0.1 and was refused. The container resolves IPv4 first, as
# the runner does. And it runs as the runner's user, 1001, who owns the checkout: as root, git
# refused the workspace as of dubious ownership. core's ci-playwright-image test holds the tag to the
# lockfile and to the visual job's Dockerfile, the resolution order and the user.
jobs:
  # Dimensions 1-4: deterministic, fast, no screenshots → the base Playwright image, not the visual
  # job's pinned fonts.
  contracts:
    name: contracts (dim 1-4) (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      env:
        NODE_OPTIONS: --dns-result-order=ipv4first
      options: --user 1001
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # By project, then by shard (certify-projects.ts, #321). Playwright splits by test COUNT,
        # not by duration: four shards over the whole folder took 8, 9, 1 and 4 minutes, because the
        # cheapest spec (manifest-contract, which shares pages) filled one shard by itself. Each
        # project is sharded as its cost asks; core's ci-certification test checks that this list
        # holds every shard of every project.
        include:
          - { project: axe, shard: 1, of: 2 }
          - { project: axe, shard: 2, of: 2 }
          # Three shards since #1075: one took 12m53s–15m07s, the critical path of every pull request.
          - { project: contracts, shard: 1, of: 3 }
          - { project: contracts, shard: 2, of: 3 }
          - { project: contracts, shard: 3, of: 3 }
          - { project: guards, shard: 1, of: 2 }
          - { project: guards, shard: 2, of: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.8.1 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate scenarios + registry
        run: pnpm --filter @pdxui/responsive test:gen
      # The whole certification folder, as `test:certify` runs it: no file filter. A list of named
      # specs here would leave every other regression guard in the folder running on a developer's
      # machine and never in CI. skill-claims rides along — a check that never runs lets the skill
      # drift from the code.
      - name: Certification folder (dim 1-4, skill claims, regression guards)
        run: >
          pnpm --filter @pdxui/responsive exec playwright test
          --config tests/playwright-ui.config.ts
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.of }}
      # The component-coherence behavior suite, which `test:certify` runs after the folder.
      # 37 tests, ~15 s: once, with the first contracts shard.
      - name: Behavior suite
        if: matrix.project == 'contracts' && matrix.shard == 1
        run: pnpm --filter @pdxui/responsive exec playwright test --config tests/playwright-behavior.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: contracts-report-${{ matrix.project }}-${{ matrix.shard }}
          path: packages/responsive/test-results

  # The frozen baseline-2024 target keeps a reduced run (decision 16, #509): Dim 1 on the 13 themes,
  # with the scenario pages building the design CSS in the 2024 form (PDX_TARGET, read by the pages'
  # Vite config and by Dim 1 from certify-target.ts). DOM, ARIA and keyboard do not depend on the
  # target, so Dims 2, 4 and 5 are not run for it. A scenario certified on baseline-2026 only says so
  # in its manifest (`onlyOn`), with the reason, and is left out here.
  contracts-2024:
    name: contracts (dim 1, baseline-2024) (${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      env:
        NODE_OPTIONS: --dns-result-order=ipv4first
      options: --user 1001
    timeout-minutes: 45
    # The contracts project, sharded as the contracts job shards it (#1075): one job took 10m57s–13m06s.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, of: 3 }
          - { shard: 2, of: 3 }
          - { shard: 3, of: 3 }
    env:
      PDX_TARGET: baseline-2024
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.8.1 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generate scenarios + registry
        run: pnpm --filter @pdxui/responsive test:gen
      - name: Dim 1, contract math, on baseline-2024
        run: >
          pnpm --filter @pdxui/responsive exec playwright test
          --config tests/playwright-ui.config.ts
          --project=contracts
          --shard=${{ matrix.shard }}/${{ matrix.of }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: contracts-report-baseline-2024-${{ matrix.shard }}
          path: packages/responsive/test-results

  # Dimension 5: visual regression in the pinned Docker image (bit-for-bit determinism).
  visual:
    name: visual (dim 5, docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true } # the PNG baselines are in Git LFS
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # Through run.mjs, NOT a docker command spelled out here.
      #
      # A docker command spelled out here, ending in
      # `playwright test --config tests/playwright-docker.config.ts visual-runner`, would select
      # visual-runner.spec.ts alone — the positional is a regex over the file path; measured with
      # --list: "Total: 1586 tests in 1 file" — and exclude fonts.spec.ts, the guard against a
      # font resolving to a CJK face so that every heading of every baseline renders in Chinese
      # with the whole suite green. A screenshot suite cannot catch that.
      #
      # So one place decides what runs in the container. run.mjs owns that, its default is
      # asserted in core's certification-gate test, and core's ci-certification test asserts
      # that this job goes through it — so the two cannot drift apart.
      - name: Visual regression + font guard (compare with the baselines, no update)
        run: node packages/responsive/tests/docker/run.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: packages/responsive/test-results

  # One check for the whole certification, as Quality's `build · typecheck · lint · test · coverage`
  # is one for the suites: the ruleset on `main` requires it by name, so an auto-merge waits for
  # every dimension. A pull request was merged 42 seconds before its certification finished, on
  # Quality alone (#1075). `always()`: a job that failed or was cancelled must turn this red, not
  # skip it — a skipped required check reads as passed.
  certification:
    name: certification
    runs-on: ubuntu-24.04
    needs: [contracts, contracts-2024, visual]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every certification job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "a job ended '$r'"; exit 1; fi
          done
