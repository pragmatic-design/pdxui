name: Benchmark (nightly)

# js-framework-benchmark against vanillajs, three runs, every night, with PDX held to the thresholds
# in scripts/bench-jfb/thresholds.json (#248). Script times are held as PDX's ratio to vanillajs in
# the same run, memory in MB. The owner's decision (2026-10-11): the benchmark's thresholds run here,
# not in the pre-push and not on every pull request. A red night shows in the Actions tab and in
# the repository's notifications; it blocks nothing.
#
# A pull request runs it only when it changes the benchmark itself (the scripts or this file), so a
# change to the bench is measured before it lands. It is not a required check.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/bench-jfb/**'
      - '.github/workflows/bench-nightly.yml'

permissions:
  contents: read

# Set before Chromium starts, for the reason quality.yml gives (#63).
env:
  FC_FONTATIONS: '1'
  DBUS_SESSION_BUS_ADDRESS: 'disabled:'

jobs:
  bench:
    name: js-framework-benchmark thresholds
    runs-on: ubuntu-24.04
    # About 2 h 20 min from #736, when the four sub-millisecond benchmarks went to 100 samples each:
    # jfb takes 2.5 to 2.9 s a sample whatever it measures, and those benchmarks went from 70 to 410
    # samples per framework per run (select1k keeps jfb's 10 extra). Was 90, for a job of about 50 min.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.8.1 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build (every package)
        run: pnpm build
      # The runner's Chrome: the benchmark drives the browser it is given, and downloads none.
      - name: Chrome
        id: chrome
        shell: bash
        run: |
          path="$(command -v google-chrome)"
          "$path" --version
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: js-framework-benchmark, three runs
        shell: bash
        run: pnpm bench:jfb --runs 3 --headless --chrome "${{ steps.chrome.outputs.path }}" --with vanillajs --json bench.json 2>&1 | tee bench.log
      - name: Thresholds
        run: node scripts/bench-jfb/thresholds.mjs bench.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: |
            bench.json
            bench.log
