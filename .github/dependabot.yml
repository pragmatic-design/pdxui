version: 2

# One pnpm workspace with one lockfile, so npm is watched from the root, and the workflows' `uses:`
# lines from theirs. Updates are grouped per ecosystem: one pull request a week to review and run
# through the gate, rather than one per package.
updates:
  # Minor and patch only. A major of Vite, Playwright or TypeScript changes the build, the browser
  # suites or the types, and bundled with the rest it arrives as one red pull request nobody can
  # merge; a major is an upgrade done on purpose, in its own change.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Two kept out of the weekly group, each in a pull request of its own: tests here depend on
    # behaviour measured on a given happy-dom (its MutationObserver, its mount order), and citty is
    # the CLI's parser on 0.x, where a minor may change the API.
    groups:
      happy-dom:
        patterns: ["happy-dom"]
      citty:
        patterns: ["citty"]
      npm:
        patterns: ["*"]
        exclude-patterns: ["happy-dom", "citty"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Not at all: every Playwright release brings its own Chromium, and the certification image
      # (packages/responsive/tests/docker/Dockerfile) and its 1708 visual baselines are pinned to
      # one. Playwright moves on purpose, with the image and the baselines, in one change.
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright"
      - dependency-name: "playwright-core"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
