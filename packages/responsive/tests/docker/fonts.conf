<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Deterministic font rendering for the certification screenshots.

  Two jobs.

  1. Hinting and antialiasing fixed, so the same glyph rasterises identically on every machine.

  2. The generic families RESOLVE TO A LATIN SANS. Without this, `fc-match system-ui` in the
     Playwright base image returns WenQuanYi Zen Hei — a CJK face — because it happens to be
     installed and nothing says otherwise. Every heading in the design system asks for
     `'Manrope', system-ui, sans-serif`, so every heading in every baseline would be rendered in a
     Chinese typeface: heavier, taller line boxes, and a glyph coverage wide enough that arrows
     appear where a Latin font would show nothing. The screenshots would certify a rendering no
     user will ever see.

     Manrope is installed, so the first name in that chain wins. These aliases are the net
     underneath it: if a font package ever disappears, the fallback is a Latin sans and the
     failure is legible, instead of a silent switch of script.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
