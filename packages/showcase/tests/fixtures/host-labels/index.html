<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PDX host-labels fixture</title>
  </head>
  <body>
    <!-- tests/host-labels.spec.ts: served by the dev server, outside the showcase app. -->
    <form id="f">
      <label for="name">Name</label>
      <app-hl-field id="name" name="name"></app-hl-field>
      <hl-unlabelled id="other" name="other"></hl-unlabelled>
      <!-- No id: named only by the label that holds it. -->
      <label id="wrap">Wrapped <hl-unlabelled name="wrapped"></hl-unlabelled></label>
      <hl-plain id="plain"></hl-plain>
      <label for="plain">Plain</label>
      <!-- The library's select, named by a <label for> its host's id. -->
      <label for="size-select">Size</label>
      <pdx-select id="size-select" placeholder="Pick one"></pdx-select>
    </form>
    <script type="module" src="./main.js"></script>
  </body>
</html>
