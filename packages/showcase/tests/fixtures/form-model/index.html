<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PDX form-model fixture</title>
  </head>
  <body>
    <!-- tests/form-model.spec.ts: served by the dev server, outside the showcase app. -->
    <form id="f">
      <fieldset id="fs">
        <app-fm-text name="t"></app-fm-text>
        <fm-check name="c" value="yes"></fm-check>
        <fm-check name="c2"></fm-check>
        <fm-tags name="tags"></fm-tags>
        <fm-number name="n"></fm-number>
        <fm-object name="o"></fm-object>
      </fieldset>
    </form>
    <!-- What the form submits when it is not the model (#751), in a form of its own. -->
    <form id="f2">
      <app-fm-expr name="e"></app-fm-expr>
      <app-fm-null name="z"></app-fm-null>
    </form>
    <!-- When a value is missing, said by the component (#1039), in a form of its own. -->
    <form id="f3">
      <app-fm-missing name="m" required></app-fm-missing>
    </form>
    <script type="module" src="./main.js"></script>
  </body>
</html>
