<!DOCTYPE html>
<html lang="en" pdx-theme="neutral" pdx-scheme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Behavior Harness</title>
    <style>
        html, body { margin: 0; }
        body { background: var(--pdx-color-bg, #fff); color: var(--pdx-color-text, #111); padding: 40px; font-family: var(--pdx-font-sans, system-ui); }
        /* a roomy host so layout-sensitive components have space to render */
        #root { display: inline-block; min-width: 220px; }
    </style>
    <script type="module">
        // Generic harness for the component coherence audit: renders ONE component from ?tag, seeds
        // initial attributes from ?a:<name>=<value>, applies ?theme/?scheme. Playwright then drives
        // props (window.__el) and measures. Registers the one tag it renders (not the barrel).
        import '@pdxui/design';
        import { loadTags } from './generated/component-loaders.js';

        const p = new URLSearchParams(location.search);
        const theme = p.get('theme'); const scheme = p.get('scheme');
        if (theme) document.documentElement.setAttribute('pdx-theme', theme);
        if (scheme) document.documentElement.setAttribute('pdx-scheme', scheme);

        // The tag and the attributes come from the URL (#72): only a library tag the loaders know, and no
        // event-handler attribute — `?a:onclick=…` would be script the page runs.
        const tag = p.get('tag');
        if (tag && !/^pdx-[a-z0-9]+(?:-[a-z0-9]+)*$/.test(tag)) throw new Error('not a library tag: ' + tag);
        if (tag) {
            await loadTags([tag]);
            const el = document.createElement(tag);
            el.setAttribute('data-test', 'subject');
            for (const [k, v] of p) {
                if (!k.startsWith('a:')) continue;
                const name = k.slice(2);
                if (/^on/i.test(name)) throw new Error('an event-handler attribute is not a scenario attribute: ' + name);
                el.setAttribute(name, v);
            }
            const text = p.get('text'); if (text) el.textContent = text;
            document.getElementById('root').appendChild(el);
            window.__el = el;
            // Imperative prop setter (typed) for reactivity tests.
            window.__setProp = (name, value) => { try { el[name] = value; } catch (_e) { el.setAttribute(name, String(value)); } };
            // Signal ready after the element has had two frames to upgrade + render.
            requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.setAttribute('data-pdx-ready', '1')));
        } else {
            document.documentElement.setAttribute('data-pdx-ready', '1');
        }
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
