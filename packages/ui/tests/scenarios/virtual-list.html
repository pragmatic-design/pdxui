<!DOCTYPE html>
<html lang="en" pdx-theme="neutral" pdx-scheme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Virtual List Harness</title>
    <style>
        html, body { margin: 0; }
        body { font-family: system-ui; padding: 16px; }
        ul { height: 400px; width: 320px; overflow: auto; margin: 0; padding: 0; list-style: none; border: 1px solid #999; }
        li { height: 40px; box-sizing: border-box; border-bottom: 1px solid #ddd; }
        li:focus, li button:focus { outline: 2px solid #06c; }
        table { border-collapse: collapse; width: 320px; }
        tbody { display: block; height: 400px; overflow: auto; }
        thead, tbody tr { display: table; width: 100%; table-layout: fixed; }
        tr { height: 40px; }
        td, th { box-sizing: border-box; height: 40px; padding: 0 8px; border-bottom: 1px solid #ddd; text-align: left; }
    </style>
    <script type="module">
        // `eachVirtual` — what `@for … @virtual(40)` compiles to (#283) — in the containers a template
        // writes (#284).
        //
        // `?source=array` (the default) renders 10 000 items, in the container `?shape=` names:
        //   · `list` (the default): a `<ul>`, each item a `<li>` holding a `<button>`;
        //   · `listbox`: a `<ul role="listbox">` of `<li role="option">`;
        //   · `table`: a `<table>` with a header row, its `<tbody>` the scroll container.
        // `paged` is a source of 3 pages of 50 that counts its `loadMore()` calls; `empty` is a source
        // with no data that is not loading; `loading` is one with no data that is. The page asserts
        // nothing: the spec reads the DOM.
        import { eachVirtual, signal } from '@pdxui/core';

        const params = new URLSearchParams(location.search);
        const mode = params.get('source') ?? 'array';
        const shape = params.get('shape') ?? 'list';

        let container;
        if (shape === 'table') {
            const table = document.createElement('table');
            table.setAttribute('data-test', 'table');
            table.innerHTML = '<thead><tr><th>Item</th></tr></thead>';
            container = document.createElement('tbody');
            table.appendChild(container);
            document.body.appendChild(table);
        } else {
            container = document.createElement('ul');
            if (shape === 'listbox') {
                container.setAttribute('role', 'listbox');
                container.setAttribute('aria-label', 'Items');
            }
            document.body.appendChild(container);
        }
        container.setAttribute('data-test', 'list');

        let items;
        if (mode === 'array') {
            const all = Array.from({ length: 10000 }, (_, i) => ({ id: i, label: 'Item ' + i }));
            items = () => all;
        } else {
            const data = signal(mode === 'paged' ? page(0) : []);
            const isLoading = signal(mode === 'loading');
            let pages = 1;
            window.__loadMoreCalls = 0;
            const source = {
                data,
                isLoading,
                hasMore: () => mode === 'paged' && pages < 3,
                loadMore: () => {
                    window.__loadMoreCalls++;
                    isLoading.set(true);
                    return new Promise((resolve) => setTimeout(() => {
                        data.set([...data.peek(), ...page(pages)]);
                        pages++;
                        isLoading.set(false);
                        resolve();
                    }, 30));
                },
            };
            items = () => source;
        }

        function page(n) {
            return Array.from({ length: 50 }, (_, i) => ({ id: n * 50 + i, label: 'Item ' + (n * 50 + i) }));
        }

        function row(r) {
            if (shape === 'table') {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.textContent = r.label;
                tr.appendChild(td);
                return tr;
            }
            const li = document.createElement('li');
            if (shape === 'listbox') {
                li.setAttribute('role', 'option');
                li.setAttribute('aria-selected', 'false');
                li.textContent = r.label;
            } else {
                const button = document.createElement('button');
                button.textContent = r.label;
                li.appendChild(button);
            }
            return li;
        }

        container.appendChild(eachVirtual(items, (r) => r.id, row, {
            estimate: 40,
            tag: shape === 'table' ? 'tr' : 'li',
            empty: () => {
                const li = document.createElement('li');
                li.setAttribute('data-test', 'empty');
                li.textContent = 'Nothing here';
                return li;
            },
        }));

        // Something to Tab to after the list.
        const after = document.createElement('button');
        after.setAttribute('data-test', 'after');
        after.textContent = 'After the list';
        document.body.appendChild(after);

        requestAnimationFrame(() => requestAnimationFrame(() => {
            document.documentElement.setAttribute('data-pdx-ready', '');
        }));
    </script>
</head>
<body>
</body>
</html>
